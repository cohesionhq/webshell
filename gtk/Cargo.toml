[package]
name = "cohesion-gtk"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "The Cohesion WebUI harness for Linux, in GTK 4 and libadwaita"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_6"] }
# Beside this repo, as the Mac app's CohesionWebKit is: the setup code,
# certificates and the protocol's types come from the daemon's own crate.
cohesion-core = { path = "../../cohesion/cohesion-core" }
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_14"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rustls = "0.23.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "__rustls-tls"] }
webkit6 = "0.6.1"
